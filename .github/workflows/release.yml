name: Release

# Push a tag like v1.0.0 to build the installer and the portable zip and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if (-not ($v -match '^\d+\.\d+\.\d+')) { $v = (python -c "import opensweep; print(opensweep.__version__)") }
          "version=$v" >> $env:GITHUB_OUTPUT

      - run: python packaging/make_icon.py
      - run: pyinstaller packaging/opensweep.spec --noconfirm

      # Optional: sign with SignPath (free for open source). See docs/SIGNING.md.
      # Set the SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID variable to turn it on.
      - name: Upload unsigned build for signing
        id: upload-unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: dist/OpenSweep
      - name: Sign executables (SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: opensweep
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/OpenSweep

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\opensweep.iss

      - name: Portable zip and checksums
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path dist\OpenSweep\* -DestinationPath "dist\OpenSweep-$v-portable.zip"
          Get-ChildItem dist\*.exe, dist\*.zip | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist\SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            dist/OpenSweep-*-setup.exe
            dist/OpenSweep-*-portable.zip
            dist/SHA256SUMS.txt
