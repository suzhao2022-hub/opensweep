name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]" pyflakes
      - run: python -m pyflakes src tests
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Validate rule files
        run: python -m opensweep.cli rules
